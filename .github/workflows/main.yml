name: Release Telegram (ARMv7 Terminator)

# Зібрано з публічних CI-скриптів збірок Telegram Android:
#   * coinman-dev/recgram      — sdkmanager для NDK/CMake, .cxx-кеш, перевірка сертифіката + SHA256SUMS,
#                                prerelase-теги
#   * eduardobastier/telegram-pro — -Dorg.gradle.jvmargs з CLI, sdkmanager, --console=plain
#   * aquqa/Telegram            — валідація Base64-keystore + keytool-перевірка ДО 90-хвилинної збірки
#   * Mercurygram/Mercurygram   — підпис через -PRELEASE_* (без мутації gradle.properties), sdkmanager з retry
# Логіка Terminator (R8, ThinLTO, armv7-лок, uk-ресурси, ccache) — твоя, збережена.

on:
  push:
    branches: ['master', 'main']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  ABI: armeabi-v7a
  FLAVOR: Afat
  # Версії беремо з TMessagesProj/build.gradle (ndkVersion 27.2.12479018, buildToolsVersion 36.0.0)
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1
  BUILD_TOOLS_VERSION: 36.0.0
  COMPILE_SDK: 36
  # 16 GB RAM на ubuntu-24.04: 9 GB Gradle/R8 + паралельний GC
  GRADLE_JVMARGS: '-Xmx9g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8'
  KOTLIN_DAEMON_JVMARGS: '-Xmx4g'
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dkotlin.incremental=false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # ── 1. Звільняємо диск (recgram/telegram-pro) ─────────────────────────────
      - name: Nuke runner bloatware
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 2. SDK-компоненти явно (recgram, telegram-pro, Mercurygram) ───────────
      # Без цього кроку на чистому ранері часто падає "NDK not configured"
      # або "compileSdk 36 not found".
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          ok=0
          for i in 1 2 3; do
            if "$SDKMANAGER" "platform-tools" "platforms;android-${COMPILE_SDK}" \
                 "build-tools;${BUILD_TOOLS_VERSION}" "ndk;${NDK_VERSION}" \
                 "cmake;${CMAKE_VERSION}"; then
              ok=1; break
            fi
            echo "sdkmanager спроба $i не вдалась, ретрай..."
            sleep $((i * 10))
          done
          [ "$ok" = 1 ] || { echo "::error::sdkmanager не зміг встановити компоненти"; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls "$ANDROID_HOME/ndk"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-armv7-v2-${{ hashFiles('**/CMakeLists.txt', '**/Android.mk') }}
          restore-keys: ccache-armv7-v2-
          max-size: 4G

      - name: Tune ccache
        run: |
          ccache -M 4G
          ccache -o compression=true
          ccache -o compression_level=6
          ccache -o sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime
          ccache -z

      # ── 3. Кеш конфігурації CMake (recgram) — економить 20-40 хв на реранах ──
      - name: Cache CMake configure output
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj_App/.cxx
          key: cxx-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ hashFiles('TMessagesProj/jni/**/CMakeLists.txt', '.gitmodules') }}
          restore-keys: cxx-${{ runner.os }}-${{ env.NDK_VERSION }}-

      # ── 4. Секрети + keystore (aquqa: валідація ДО збірки) ────────────────────
      - name: Inject Secrets (with DrKLO fallbacks)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          GSERVICES_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set -euo pipefail
          umask 077
          PASS="${KS_PASS:-android}"
          ALIAS="${KEY_ALIAS:-androidkey}"
          KPASS="${KEY_PASS:-$PASS}"

          if [ -n "$KEYSTORE_B64" ]; then
            # Base64 може містити переноси рядків — чистимо перед декодуванням (aquqa)
            printf '%s' "$KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > release.keystore
            [ -s release.keystore ] || { echo "::error::Декодований keystore порожній"; exit 1; }
            # Ловимо неправильний пароль/аліас зараз, а не через 90 хвилин
            keytool -list -keystore release.keystore -storepass "$PASS" -alias "$ALIAS" > /dev/null \
              || { echo "::error::Keystore не відкривається: перевір KS_PASS / KEY_ALIAS"; exit 1; }
          else
            echo "::warning::KEYSTORE_B64 не заданий — генерую тимчасовий ключ (APK не оновить застосунок)"
            keytool -genkeypair -v -keystore release.keystore -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$KPASS" \
              -dname "CN=Telegram, OU=Android, O=Telegram, L=Kyiv, S=Kyiv, C=UA"
          fi

          mkdir -p TMessagesProj/config
          cp -f release.keystore TMessagesProj/config/release.keystore

          # Підпис передаємо Gradle через -P (як Mercurygram) — gradle.properties
          # не чіпаємо, дублікатів ключів немає.
          {
            echo "RELEASE_STORE_PASSWORD=$PASS"
            echo "RELEASE_KEY_ALIAS=$ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KPASS"
          } >> "$GITHUB_ENV"

          if [ -n "$GSERVICES_B64" ]; then
            printf '%s' "$GSERVICES_B64" | tr -d '\n\r ' | base64 -d > TMessagesProj/google-services.json
          elif [ ! -f TMessagesProj/google-services.json ]; then
            cat <<'EOF' > TMessagesProj/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "telegram-armv7",
              "storage_bucket": "telegram-armv7.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "org.telegram.messenger" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildOnly0000000000000" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": { "package_name": "org.telegram.messenger.web" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildOnly0000000000000" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000002",
                  "android_client_info": { "package_name": "org.telegram.messenger.beta" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildOnly0000000000000" }]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          if [ -d TMessagesProj_App ]; then
            cp -f TMessagesProj/google-services.json TMessagesProj_App/google-services.json
          fi

          if [ -n "$TG_API_ID" ]; then
            sed -i -E "s/APP_ID = [0-9]+;/APP_ID = ${TG_API_ID};/" \
              TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
            grep -q "APP_ID = ${TG_API_ID};" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java \
              || { echo "::error::Не вдалося підмінити APP_ID"; exit 1; }
          fi
          if [ -n "$TG_API_HASH" ]; then
            sed -i -E "s/APP_HASH = \"[^\"]*\";/APP_HASH = \"${TG_API_HASH}\";/" \
              TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
            grep -q "APP_HASH = \"${TG_API_HASH}\";" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java \
              || { echo "::error::Не вдалося підмінити APP_HASH"; exit 1; }
          fi

      # ── 5. Init-скрипт (усі оптимізації Terminator) ───────────────────────────
      - name: Generate ci/optimize.init.gradle
        run: |
          set -euo pipefail
          mkdir -p ci
          cat << 'EOF' > ci/optimize.init.gradle
          // ci/optimize.init.gradle — генерується воркфлоу (крок вище).
          // Підключається через: ./gradlew ... -I ci/optimize.init.gradle
          //
          // ГОЛОВНЕ ПРО ПОРЯДОК ВИКОНАННЯ (саме через це падало
          // "It is too late to set isDebuggable"):
          //   init-скрипт виконується ДО build.gradle модуля, тому звичайний
          //   proj.afterEvaluate {} реєструється ПІСЛЯ внутрішнього afterEvaluate AGP
          //   (AGP реєструє його всередині apply()). В результаті варіанти вже створені,
          //   DSL «заморожений» і будь-який запис у buildTypes валить конфігурацію.
          //   Рішення: реєструємо afterEvaluate через gradle.beforeProject {} — він стає
          //   ПЕРШИМ у черзі: відпрацьовує після всього build.gradle модуля, але ДО того,
          //   як AGP створить варіанти. Там DSL ще вільно змінюється.

          def NDK_FLAGS_LIST = [
              '-O3',
              '-mthumb',
              '-march=armv7-a',
              '-mfpu=neon',
              '-mfloat-abi=softfp',
              '-flto=thin',
              '-fomit-frame-pointer',
              '-ffunction-sections',
              '-fdata-sections',
              '-fvisibility=hidden',
              '-fvisibility-inlines-hidden',
              '-fmerge-all-constants',
              '-fno-unwind-tables',
              '-fno-asynchronous-unwind-tables',
              '-DNDEBUG',
              '-g0'
          ] as List<String>

          def NDK_FLAGS = NDK_FLAGS_LIST.join(' ')

          def NDK_LINKER = [
              '-fuse-ld=lld',
              '-flto=thin',
              '-Wl,-O3',
              '-Wl,--gc-sections',
              '-Wl,--icf=all',
              '-Wl,--strip-all',
              '-Wl,--exclude-libs,ALL',
              '-Wl,-Bsymbolic',
              '-Wl,--build-id=none'
          ].join(' ')

          def KOTLIN_NO_ASSERTIONS = [
              '-Xno-param-assertions',
              '-Xno-call-assertions',
              '-Xno-receiver-assertions'
          ] as List<String>

          def APK_EXCLUDES = [
              'META-INF/*.version',
              'META-INF/*.kotlin_module',
              'META-INF/DEPENDENCIES',
              'META-INF/LICENSE*',
              'META-INF/NOTICE*',
              'META-INF/AL2.0',
              'META-INF/LGPL2.1',
              'META-INF/proguard/**',
              'META-INF/com.android.tools/**',
              'META-INF/services/**',
              'kotlin/**',
              'DebugProbesKt.bin',
              '**/*.kotlin_builtins',
              '**/*.proto',
              'google/protobuf/**',
              'okhttp3/internal/publicsuffix/*'
          ] as List<String>

          // ── 1. Kotlin: вирізаємо рантайм-перевірки з байткоду (менший DEX, швидший старт) ──
          allprojects { proj ->
              proj.tasks.configureEach { t ->
                  if (t.class.name.contains('KotlinCompile')) {
                      try {
                          t.compilerOptions.freeCompilerArgs.addAll(KOTLIN_NO_ASSERTIONS)
                      } catch (ignored) {
                          try {
                              t.kotlinOptions.freeCompilerArgs += KOTLIN_NO_ASSERTIONS
                          } catch (ignored2) {
                              // інший API — не критично
                          }
                      }
                  }
              }
          }

          // ── 2. Android-модулі: конфіг ДО створення варіантів AGP ─────────────────────
          gradle.beforeProject { proj ->
              proj.afterEvaluate {
                  def android = proj.extensions.findByName('android')
                  if (android == null) {
                      return
                  }

                  def isApp = proj.plugins.hasPlugin('com.android.application')
                  def log = { String msg -> proj.logger.lifecycle("[optimize] ${proj.path}: ${msg}") }

                  // Фікс сумісності кастомних buildTypes із бібліотеками (:jlatexmath тощо)
                  try {
                      android.buildTypes.all { bt ->
                          if (bt.name != 'debug' && bt.name != 'release' && bt.matchingFallbacks.isEmpty()) {
                              bt.matchingFallbacks = ['release']
                          }
                      }
                  } catch (e) {
                      log("matchingFallbacks skip: ${e.message}")
                  }

                  // ── 3. ТІЛЬКИ дефолтні ресурси з values/ + українська ('uk'). Ніяких 'en' ──
                  if (isApp) {
                      try {
                          android.defaultConfig.resourceConfigurations.clear()
                          android.defaultConfig.resourceConfigurations.add('uk')
                      } catch (e) {
                          try {
                              android.defaultConfig.resConfigs('uk')
                          } catch (e2) {
                              log("resourceConfigurations skip: ${e2.message}")
                          }
                      }
                  }

                  // ── 4. Жорсткий лок на 32-бітний armv7 (defaultConfig + flavors + buildTypes) ──
                  // Працює і зі старим MutableSet<String>, і з новим SetProperty<String>.
                  def lockAbi = { cfg ->
                      try {
                          def filters = cfg.ndk.abiFilters
                          if (filters == null) {
                              return
                          }
                          try {
                              filters.clear()
                              filters.add('armeabi-v7a')
                          } catch (e1) {
                              try {
                                  filters.set(['armeabi-v7a'])
                              } catch (e2) {
                                  log("abiFilters skip: ${e2.message}")
                              }
                          }
                      } catch (e) {
                          log("abiFilters skip: ${e.message}")
                      }
                  }
                  lockAbi(android.defaultConfig)
                  try { android.productFlavors.all { flavor -> lockAbi(flavor) } } catch (ignored) {}
                  try { android.buildTypes.all { bt -> lockAbi(bt) } } catch (ignored) {}

                  try {
                      android.splits.abi.enable = false
                      android.splits.density.enable = false
                  } catch (ignored) {
                      // у library-модулів splits немає — це нормально
                  }

                  // ── 5. R8 / ProGuard ──
                  // DrKLO уже тримає для release: debuggable=false, jniDebuggable=false,
                  // minifyEnabled=true, shrinkResources=true і proguard-android-optimize.txt.
                  // Тому тут НЕ переписуємо ці властивості (саме вони й падали з
                  // "too late to set isDebuggable") — лише добиваємо те, чого немає,
                  // і прибираємо дебаг-символи з нативки.
                  try {
                      android.buildTypes.all { bt ->
                          try {
                              if (bt.ndk.debugSymbolLevel != 'NONE') {
                                  bt.ndk.debugSymbolLevel = 'NONE'
                              }
                          } catch (ignored) {}
                          if (bt.name == 'release' && isApp) {
                              try { if (!bt.minifyEnabled) bt.minifyEnabled = true } catch (ignored) {}
                              try { if (!bt.shrinkResources) bt.shrinkResources = true } catch (ignored) {}
                          }
                      }
                  } catch (e) {
                      log("buildTypes skip: ${e.message}")
                  }

                  // ── 6. Випалюємо сміття з APK ──
                  // jniLibs.useLegacyPackaging=true стискає .so всередині APK (менший APK).
                  // Звертаємось до android.packaging, а не packagingOptions { }: DSL-блок
                  // перезаписується build.gradle модуля.
                  // Кожна властивість — окремо: якщо AGP змінить тип, не втрачаємо решту.
                  try {
                      def legacy = android.packaging.jniLibs.useLegacyPackaging
                      try {
                          legacy.set(true)
                      } catch (e) {
                          legacy = true
                      }
                  } catch (e) {
                      log("jniLibs.useLegacyPackaging skip: ${e.message}")
                  }
                  try {
                      android.packaging.resources.excludes.addAll(APK_EXCLUDES)
                  } catch (e) {
                      log("resources.excludes skip: ${e.message}")
                  }

                  // ── 7. Нативна м'ясорубка (Clang + LLD + ThinLTO + NEON + Thumb-2) ──
                  // Прапорці живуть у defaultConfig.externalNativeBuild.cmake — саме звідти
                  // їх читає AGP при створенні варіантів.
                  def hasNative = false
                  try {
                      def topCmake = android.externalNativeBuild?.cmake
                      if (topCmake != null) {
                          def raw = null
                          try {
                              raw = topCmake.path
                          } catch (ignored) {}
                          if (raw != null) {
                              try {
                                  // Property<File> (AGP 8)
                                  raw = raw.getOrNull()
                              } catch (ignored) {
                                  // простий File — лишаємо як є
                              }
                              hasNative = raw != null
                          }
                      }
                  } catch (ignored) {}

                  if (hasNative) {
                      try {
                          def cmake = android.defaultConfig.externalNativeBuild.cmake
                          cmake.cFlags.addAll(NDK_FLAGS_LIST)
                          cmake.cppFlags.addAll(NDK_FLAGS_LIST)
                          cmake.arguments.addAll([
                              '-DANDROID_STL=c++_static',
                              '-DANDROID_ARM_NEON=TRUE',
                              '-DCMAKE_BUILD_TYPE=Release',
                              "-DCMAKE_C_FLAGS_RELEASE=${NDK_FLAGS}",
                              "-DCMAKE_CXX_FLAGS_RELEASE=${NDK_FLAGS}",
                              "-DCMAKE_SHARED_LINKER_FLAGS=${NDK_LINKER}",
                              "-DCMAKE_MODULE_LINKER_FLAGS=${NDK_LINKER}"
                          ])
                      } catch (e) {
                          log("cmake flags skip: ${e.message}")
                      }
                  }
              }
          }
          EOF
          wc -l ci/optimize.init.gradle

      # ── 6. Збірка ─────────────────────────────────────────────────────────────
      # Підпис — через -PRELEASE_* (Mercurygram): gradle.properties не мутуємо.
      # --no-configuration-cache: init-скрипт править DSL, кеш конфігурації тут шкідливий.
      - name: Compile (Maximum Overdrive)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj_App:assemble${FLAVOR}Release \
            -I ci/optimize.init.gradle \
            -Pandroid.injected.build.abi=$ABI \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            -Dkotlin.daemon.jvmargs="$KOTLIN_DAEMON_JVMARGS" \
            -Dorg.gradle.jvmargs="$GRADLE_JVMARGS" \
            --parallel --build-cache --no-daemon --no-configuration-cache \
            --console=plain --stacktrace \
            -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease \
            -x test -x testReleaseUnitTest 2>&1 | tee gradle-build.log
          ccache -s

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 3

      # ── 7. Перевірка + підпис (recgram: сертифікат + SHA256SUMS) ──────────────
      - name: Align & Sign (v1+v2+v3)
        env:
          EXPECTED_CERT: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          [ -x "$BT/apksigner" ] || BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          # DrKLO перейменовує вихід у app.apk (applicationVariants.all → outputFileName),
          # тому шукаємо за конкретними шляхами, а не глобом по всьому дереву.
          APK=""
          for cand in \
              "TMessagesProj_App/build/outputs/apk/afat/release/app.apk" \
              "TMessagesProj_App/build/outputs/apk/afat/release/afat-release.apk" \
              "TMessagesProj_App/build/intermediates/apk/afat/release/app.apk"; do
            if [ -f "$cand" ]; then
              APK="$cand"
              break
            fi
          done
          if [ -z "$APK" ]; then
            APK=$(find . -type f -path '*outputs/apk*' -name '*.apk' ! -name '*unsigned*' | head -1 || true)
          fi
          [ -n "$APK" ] && [ -f "$APK" ] || { echo "::error::APK не знайдено"; exit 1; }
          echo "Found APK: $APK ($(du -h "$APK" | cut -f1))"

          # zipalign -p лише вирівнює .so на 4K-сторінку для uncompressed native libs;
          # -z (Zopfli) з AGP-підписаним APK ламає v2/v3-підпис — тому НЕ використовуємо.
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk

          OUT_APK="telegram-${GITHUB_REF_NAME:-dev}-armv7.apk"
          "$BT/apksigner" sign --ks release.keystore \
            --ks-pass "pass:$RELEASE_STORE_PASSWORD" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass "pass:$RELEASE_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$OUT_APK" aligned.apk

          rm -f release.keystore aligned.apk
          "$BT/apksigner" verify -v "$OUT_APK" | grep -E "Verified|v[1-3]" || true

          CERT=$("$BT/apksigner" verify --print-certs "$OUT_APK" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr 'a-f' 'A-F')
          echo "cert SHA-256: $CERT"
          if [ -n "$EXPECTED_CERT" ] && [ "$CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::APK підписано не тим ключем (очікували $EXPECTED_CERT)"
            exit 1
          fi

          sha256sum "$OUT_APK" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh "$OUT_APK"
          echo "OUT_APK=$OUT_APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-armv7
          path: |
            telegram-*-armv7.apk
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 3

      # ── 8. Реліз (recgram: пререліз для тегів з суфіксом) ─────────────────────
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$OUT_APK" SHA256SUMS.txt $PRE --generate-notes
