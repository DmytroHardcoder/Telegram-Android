name: Release Telegram (ARMv7 Terminator)

on:
  push:
    branches: ['master', 'main']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  ABI: armeabi-v7a
  FLAVOR: Afat
  # На ubuntu-24.04 є 16GB RAM. Віддаємо 9GB під Gradle/R8, вмикаємо паралельний GC
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.jvmargs="-Xmx9g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dkotlin.incremental=false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Nuke runner bloatware
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-armv7-v2-${{ hashFiles('**/CMakeLists.txt', '**/Android.mk') }}
          restore-keys: ccache-armv7-v2-
          max-size: 4G

      - name: Tune ccache
        run: |
          ccache -M 4G
          ccache -o compression=true
          ccache -o compression_level=6
          ccache -o sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime
          ccache -z

      - name: Inject Secrets (with DrKLO fallbacks)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          GSERVICES_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          PASS="${KS_PASS:-android}"
          ALIAS="${KEY_ALIAS:-androiddebugkey}"

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
          else
            keytool -genkeypair -v -keystore release.keystore -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Telegram, OU=Android, O=Telegram, L=Kyiv, S=Kyiv, C=UA"
          fi

          mkdir -p TMessagesProj/config
          cp -f release.keystore TMessagesProj/config/release.keystore
          cat << EOF >> gradle.properties

          RELEASE_KEY_PASSWORD=$PASS
          RELEASE_KEY_ALIAS=$ALIAS
          RELEASE_STORE_PASSWORD=$PASS
          EOF

          if [ -n "$GSERVICES_B64" ]; then
            echo "$GSERVICES_B64" | base64 -d > TMessagesProj/google-services.json
          elif [ ! -f TMessagesProj/google-services.json ]; then
            cat << 'EOF' > TMessagesProj/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "telegram-armv7",
              "storage_bucket": "telegram-armv7.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "org.telegram.messenger" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildOnly0000000000000" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": { "package_name": "org.telegram.messenger.web" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildOnly0000000000000" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000002",
                  "android_client_info": { "package_name": "org.telegram.messenger.beta" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildOnly0000000000000" }]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          cp -f TMessagesProj/google-services.json TMessagesProj_App/google-services.json || true

          if [ -n "$TG_API_ID" ]; then
            sed -i "s/APP_ID = .*;/APP_ID = ${TG_API_ID};/" \
              TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          fi
          if [ -n "$TG_API_HASH" ]; then
            sed -i "s/APP_HASH = \".*\";/APP_HASH = \"${TG_API_HASH}\";/" \
              TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          fi

      - name: Generate ci/optimize.init.gradle
        run: |
          mkdir -p ci
          cat << 'EOF' > ci/optimize.init.gradle
          allprojects {
              afterEvaluate { p ->
                  // 1. Вирізаємо рантайм-перевірки Kotlin з байткоду (менший DEX, швидший запуск)
                  p.tasks.matching { it.class.name.contains("KotlinCompile") }.configureEach {
                      try {
                          compilerOptions.freeCompilerArgs.addAll([
                              '-Xno-param-assertions',
                              '-Xno-call-assertions',
                              '-Xno-receiver-assertions'
                          ])
                      } catch (ignored) {
                          try {
                              kotlinOptions.freeCompilerArgs += [
                                  '-Xno-param-assertions',
                                  '-Xno-call-assertions',
                                  '-Xno-receiver-assertions'
                              ]
                          } catch (ignored2) {}
                      }
                  }

                  def android = p.extensions.findByName('android')
                  if (android == null) return

                  def isApp = p.plugins.hasPlugin('com.android.application')

                  // Фікс сумісності кастомних buildTypes із бібліотеками (:jlatexmath тощо)
                  android.buildTypes.all { bt ->
                      if (bt.name != 'debug' && bt.name != 'release') {
                          try { bt.matchingFallbacks += ['release'] } catch (ignored) {}
                      }
                  }

                  // 2. ТІЛЬКИ дефолтний конфіг (вшитий у values/) та Українська ('uk'). Ніяких 'en'!
                  if (isApp) {
                      try {
                          android.defaultConfig.resourceConfigurations.clear()
                          android.defaultConfig.resourceConfigurations.add("uk")
                      } catch (ignored) {
                          android.defaultConfig.resConfigs("uk")
                      }
                  }

                  // 3. Жорсткий лок на 32-бітний armv7 (у defaultConfig, всіх flavors включно з afat, та buildTypes)
                  android.defaultConfig.ndk.abiFilters.clear()
                  android.defaultConfig.ndk.abiFilters.add('armeabi-v7a')
                  try { android.defaultConfig.externalNativeBuild.cmake.abiFilters.clear() } catch (ignored) {}

                  android.productFlavors.all { flavor ->
                      try {
                          flavor.ndk.abiFilters.clear()
                          flavor.ndk.abiFilters.add('armeabi-v7a')
                      } catch (ignored) {}
                      try { flavor.externalNativeBuild.cmake.abiFilters.clear() } catch (ignored) {}
                  }

                  android.buildTypes.all { bt ->
                      try {
                          bt.ndk.abiFilters.clear()
                          bt.ndk.abiFilters.add('armeabi-v7a')
                      } catch (ignored) {}
                      try { bt.externalNativeBuild.cmake.abiFilters.clear() } catch (ignored) {}
                  }

                  if (android.hasProperty('splits')) {
                      android.splits.abi.enable = false
                      android.splits.density.enable = false
                  }

                  // 4. Випалюємо сміття з APK
                  android.packagingOptions {
                      jniLibs.useLegacyPackaging = true // Стискати .so всередині APK (ріже розмір APK вдвічі)
                      resources.excludes += [
                          'META-INF/*.version',
                          'META-INF/*.kotlin_module',
                          'META-INF/DEPENDENCIES',
                          'META-INF/LICENSE*',
                          'META-INF/NOTICE*',
                          'META-INF/AL2.0',
                          'META-INF/LGPL2.1',
                          'META-INF/proguard/**',
                          'META-INF/com.android.tools/**',
                          'META-INF/services/**',
                          'kotlin/**',
                          'DebugProbesKt.bin',
                          '**/*.kotlin_builtins',
                          '**/*.proto',
                          'google/protobuf/**',
                          'okhttp3/internal/publicsuffix/*'
                      ]
                  }

                  // 5. R8 / ProGuard на максималках (shrinkResources дозволений тільки для com.android.application)
                  android.buildTypes.matching { it.name == 'release' }.all { bt ->
                      bt.debuggable = false
                      bt.jniDebuggable = false
                      bt.renderscriptDebuggable = false
                      bt.pseudoLocalesEnabled = false
                      try { bt.ndk.debugSymbolLevel = 'NONE' } catch (ignored) {}

                      if (isApp) {
                          bt.minifyEnabled = true
                          bt.shrinkResources = true
                          bt.crunchPngs = true

                          // Підміняємо дефолтний proguard-android.txt на агресивний optimize
                          def currentFiles = bt.proguardFiles.findAll { !it.name.contains('proguard-android.txt') }
                          bt.setProguardFiles(currentFiles)
                          bt.proguardFile(android.getDefaultProguardFile('proguard-android-optimize.txt'))
                      }
                  }

                  // 6. Нативна м'ясорубка (Clang + LLD + ThinLTO + ARMv7 NEON + Thumb-2)
                  def terminatorFlagsList = [
                      '-O3',
                      '-mthumb',                        // Компактний 16/32-bit Thumb-2 код без втрати швидкості
                      '-march=armv7-a',
                      '-mfpu=neon',                     // Примусовий SIMD для відео/аудіо/стікерів
                      '-mfloat-abi=softfp',
                      '-flto=thin',                     // Міжмодульна оптимізація
                      '-fomit-frame-pointer',           // Звільняємо регістр R7/R11 для обчислень
                      '-ffunction-sections',
                      '-fdata-sections',
                      '-fvisibility=hidden',
                      '-fvisibility-inlines-hidden',
                      '-fmerge-all-constants',          // Зливає однакові константи в пам'яті
                      '-fno-unwind-tables',             // Викидає таблиці розмотки стеку (економія МБ)
                      '-fno-asynchronous-unwind-tables',
                      '-DNDEBUG',
                      '-g0'                             // Нуль дебаг-інфи на рівні компілятора
                  ]
                  def terminatorFlags = terminatorFlagsList.join(' ')

                  def terminatorLinker = [
                      '-fuse-ld=lld',
                      '-flto=thin',
                      '-Wl,-O3',
                      '-Wl,--gc-sections',              // Видаляє невикористані функції
                      '-Wl,--icf=all',                  // Склеює функції з однаковим машинним кодом
                      '-Wl,--strip-all',                // Повний стрип символів
                      '-Wl,--exclude-libs,ALL',         // КРИТИЧНО: ховає символи статичних ліб (ffmpeg/ssl), дозволяючи їх вирізати
                      '-Wl,-Bsymbolic',                 // Прискорює виклики функцій всередині .so
                      '-Wl,--build-id=none'             // Прибирає хеш білда з заголовка ELF
                  ].join(' ')

                  if (android.externalNativeBuild?.cmake?.path != null) {
                      android.defaultConfig.externalNativeBuild.cmake.with {
                          cFlags.addAll(terminatorFlagsList)
                          cppFlags.addAll(terminatorFlagsList)
                          arguments.addAll([
                              '-DANDROID_STL=c++_static',
                              '-DANDROID_ARM_NEON=TRUE',
                              '-DCMAKE_BUILD_TYPE=Release',
                              "-DCMAKE_C_FLAGS_RELEASE=${terminatorFlags}",
                              "-DCMAKE_CXX_FLAGS_RELEASE=${terminatorFlags}",
                              "-DCMAKE_SHARED_LINKER_FLAGS=${terminatorLinker}",
                              "-DCMAKE_MODULE_LINKER_FLAGS=${terminatorLinker}"
                          ])
                      }
                  }
              }
          }
          EOF

      - name: Compile (Maximum Overdrive)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          ./gradlew :TMessagesProj_App:assemble${FLAVOR}Release \
            -I ci/optimize.init.gradle \
            -Pandroid.injected.build.abi=$ABI \
            --parallel --build-cache --no-daemon \
            -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease \
            -x test -x testReleaseUnitTest
          ccache -s

      - name: Zopfli Align & Sign (v1+v2+v3)
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          PASS="${KS_PASS:-android}"
          ALIAS="${KEY_ALIAS:-androiddebugkey}"

          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(find . -path '*outputs/apk*' -name '*.apk' | head -1)
          echo "Found raw APK: $APK"
          
          # -z перепаковує непожаті потоки алгоритмом Zopfli
          $BT/zipalign -f -p -z 4 "$APK" aligned.apk
          
          OUT_APK="telegram-${GITHUB_REF_NAME:-dev}-armv7.apk"
          $BT/apksigner sign --ks release.keystore --ks-pass "pass:$PASS" \
            --ks-key-alias "$ALIAS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$OUT_APK" aligned.apk
            
          rm -f release.keystore aligned.apk
          $BT/apksigner verify -v "$OUT_APK" | grep -E "Verified|v[1-3]"
          ls -lh "$OUT_APK"

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-armv7
          path: telegram-*-armv7.apk
          compression-level: 0
          retention-days: 3

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" telegram-*-armv7.apk --generate-notes
